name: Validate Tasteprint Pull Requests

on:
  pull_request:


permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Verify reporting SQL grants and tenant isolation
        run: bash scripts/check-workspace-reporting.sh
      - run: npm run build

      - name: Install Chromium for guest/operator browser checks
        run: npx playwright install --with-deps chromium
      - name: Verify integrated production builds at root and Pages base paths
        run: npm run test:browser
